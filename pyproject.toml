[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gapatlas"
version = "0.1.0"
description = "CVD Prevention Gap Atlas: county and census-tract map of where cardiovascular risk burden outpaces prevention capacity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gideon Owusu", email = "gideono@mtu.edu" }]
maintainers = [{ name = "Gideon Owusu", email = "gideono@mtu.edu" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]
site = ["geopandas>=0.14", "shapely>=2.0", "pyogrio>=0.7"]

[project.scripts]
gapatlas = "gapatlas.cli:main"

[tool.setuptools]
packages = ["gapatlas"]
